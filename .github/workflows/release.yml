name: Release Windows build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package.json version $version"
          }

      - name: Check types
        run: pnpm type

      - name: Lint
        run: pnpm lint

      - name: Run headless tests
        run: pnpm test

      - name: Run main-process proxy smoke
        run: pnpm test:proxy
        env:
          ELECTRON_ENABLE_LOGGING: '1'

      - name: Run update-check smoke
        run: pnpm test:update
        env:
          ELECTRON_ENABLE_LOGGING: '1'

      - name: Build default installer
        run: pnpm dist:win
        env:
          DSCHAT_GITHUB_REPO: ${{ github.repository }}

      - name: Package web build
        run: node scripts/package-web.mjs

      - name: Write checksums
        shell: pwsh
        run: |
          Get-FileHash "release/DSChat-*.exe", "release/DSChat-*-web.zip" -Algorithm SHA256 | ForEach-Object {
            "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf)
          } | Set-Content release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
            $tag = "v$version"
          }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "DSChat $tag" --generate-notes
          }
          $files = @(Get-ChildItem "release/DSChat-*.exe", "release/DSChat-*.exe.blockmap", "release/DSChat-*-web.zip" | ForEach-Object { $_.FullName })
          $files += (Resolve-Path "release/SHA256SUMS.txt").Path
          gh release upload $tag $files --clobber
