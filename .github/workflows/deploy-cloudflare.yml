name: Deploy web to Cloudflare Pages

# 手动触发；需要仓库 Secrets：
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
# 详见 docs/WEB-DEPLOY.md。
on:
  workflow_dispatch:
    inputs:
      project_name:
        description: Cloudflare Pages project name
        required: false
        default: dschat
      api_origin:
        description: Optional DSCHAT_API_ORIGIN (empty = official DeepSeek)
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm type

      - name: Lint
        run: pnpm lint

      - name: Run headless tests
        run: pnpm test

      - name: Build web assets
        run: pnpm build
        env:
          DSCHAT_API_ORIGIN: ${{ inputs.api_origin }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name ${{ inputs.project_name }}
